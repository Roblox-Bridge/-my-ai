name = "aetherai-studio"
main = "worker.js"
compatibility_date = "2026-09-25"

workers_dev = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[vars]
DEFAULT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
IMAGE_MODEL = "@cf/stabilityai/stable-diffusion-xl-base-1.0"
GROQ_MODEL = "llama-3.3-70b-versatile"
