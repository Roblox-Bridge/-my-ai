<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AetherAI Studio</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top left,
          rgba(99,102,241,.18),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(168,85,247,.14),
          transparent 35%
        ),
        #07070b;
      color: #f4f4f5;
      font-family: Inter, system-ui, sans-serif;
    }

    .glass {
      background: rgba(18,18,25,.72);
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .message {
      white-space: pre-wrap;
      line-height: 1.7;
    }

    textarea {
      resize: none;
    }

    ::-webkit-scrollbar {
      width: 7px;
    }

    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 999px;
    }
  </style>
</head>

<body>

<div class="min-h-screen flex">

  <!-- SIDEBAR -->
  <aside
    class="hidden md:flex w-72 border-r border-white/10
           bg-black/20 flex-col p-4"
  >

    <div class="flex items-center gap-3 mb-7">
      <div
        class="w-10 h-10 rounded-xl
               bg-gradient-to-br from-indigo-500 to-purple-600
               flex items-center justify-center font-bold"
      >
        A
      </div>

      <div>
        <div class="font-semibold">
          AetherAI
        </div>
        <div class="text-xs text-zinc-500">
          Studio
        </div>
      </div>
    </div>

    <button
      onclick="newChat()"
      class="w-full py-3 rounded-xl
             bg-white text-black font-semibold
             hover:bg-zinc-200 transition"
    >
      + New conversation
    </button>

    <div class="mt-7 text-xs uppercase
                tracking-wider text-zinc-500">
      Workspace
    </div>

    <button
      onclick="showChat()"
      class="mt-3 w-full text-left px-3 py-3
             rounded-xl bg-white/5 hover:bg-white/10"
    >
      💬 AI Chat
    </button>

    <button
      onclick="showImage()"
      class="mt-2 w-full text-left px-3 py-3
             rounded-xl hover:bg-white/10"
    >
      🎨 Image Studio
    </button>

    <div class="mt-auto text-xs text-zinc-600">
      AetherAI Studio
    </div>
  </aside>


  <!-- MAIN -->
  <main class="flex-1 min-w-0">

    <!-- TOPBAR -->
    <header
      class="h-16 border-b border-white/10
             flex items-center justify-between
             px-5 md:px-8"
    >

      <div class="font-semibold">
        <span id="pageTitle">
          AI Chat
        </span>
      </div>

      <div class="flex items-center gap-3">

        <select
          id="persona"
          class="glass rounded-xl px-3 py-2
                 text-sm outline-none"
        >
          <option value="architect">
            Software Architect
          </option>

          <option value="researcher">
            Research Analyst
          </option>

          <option value="creative">
            Creative Strategist
          </option>
        </select>

        <div
          id="status"
          class="hidden sm:flex items-center gap-2
                 text-xs text-green-400"
        >
          <span
            class="w-2 h-2 rounded-full bg-green-400"
          ></span>
          Online
        </div>

      </div>
    </header>


    <!-- CHAT -->
    <section
      id="chatView"
      class="flex flex-col h-[calc(100vh-4rem)]"
    >

      <div
        id="messages"
        class="flex-1 overflow-y-auto px-4 md:px-8 py-8"
      >

        <div
          id="welcome"
          class="max-w-3xl mx-auto
                 min-h-full flex flex-col
                 justify-center"
        >

          <div
            class="text-4xl md:text-6xl
                   font-bold tracking-tight"
          >
            Build with
            <span
              class="bg-gradient-to-r
                     from-indigo-400 to-purple-400
                     bg-clip-text text-transparent"
            >
              AetherAI
            </span>
          </div>

          <p
            class="mt-5 text-zinc-400
                   text-lg"
          >
            Chat, research ideas, write code,
            and create with your AI workspace.
          </p>

          <div
            class="grid md:grid-cols-3
                   gap-3 mt-8"
          >

            <button
              onclick="useSuggestion('Build me a modern website architecture')"
              class="glass p-4 rounded-2xl text-left
                     hover:bg-white/10"
            >
              <b>Architecture</b>
              <div class="text-sm text-zinc-500 mt-1">
                Design a software system
              </div>
            </button>

            <button
              onclick="useSuggestion('Research and explain this topic clearly')"
              class="glass p-4 rounded-2xl text-left
                     hover:bg-white/10"
            >
              <b>Research</b>
              <div class="text-sm text-zinc-500 mt-1">
                Analyze a topic
              </div>
            </button>

            <button
              onclick="useSuggestion('Give me 10 original AI project ideas')"
              class="glass p-4 rounded-2xl text-left
                     hover:bg-white/10"
            >
              <b>Ideas</b>
              <div class="text-sm text-zinc-500 mt-1">
                Generate creative concepts
              </div>
            </button>

          </div>
        </div>

      </div>


      <!-- COMPOSER -->
      <div class="p-4 md:p-6">

        <div
          class="max-w-4xl mx-auto glass rounded-2xl p-3"
        >

          <textarea
            id="prompt"
            rows="2"
            placeholder="Message AetherAI..."
            class="w-full bg-transparent
                   outline-none px-3 py-2
                   text-white placeholder-zinc-600"
          ></textarea>

          <div
            class="flex items-center
                   justify-between mt-2"
          >

            <div class="text-xs text-zinc-600 px-3">
              AetherAI
            </div>

            <button
              id="sendBtn"
              onclick="sendMessage()"
              class="px-5 py-2.5 rounded-xl
                     bg-white text-black
                     font-semibold
                     hover:bg-zinc-200"
            >
              Send
            </button>

          </div>
        </div>

      </div>

    </section>


    <!-- IMAGE STUDIO -->
    <section
      id="imageView"
      class="hidden p-5 md:p-10"
    >

      <div class="max-w-5xl mx-auto">

        <h1 class="text-3xl font-bold">
          Image Studio
        </h1>

        <p class="text-zinc-500 mt-2">
          Generate images with SDXL.
        </p>

        <div
          class="glass rounded-2xl p-5 mt-8"
        >

          <label class="text-sm text-zinc-400">
            Prompt
          </label>

          <textarea
            id="imagePrompt"
            rows="5"
            class="w-full mt-2 rounded-xl
                   bg-black/30 border
                   border-white/10
                   p-4 outline-none"
            placeholder="A cinematic futuristic city..."
          ></textarea>

          <label
            class="block mt-5 text-sm text-zinc-400"
          >
            Negative prompt
          </label>

          <textarea
            id="negativePrompt"
            rows="2"
            class="w-full mt-2 rounded-xl
                   bg-black/30 border
                   border-white/10
                   p-4 outline-none"
            placeholder="blurry, low quality"
          ></textarea>

          <button
            onclick="generateImage()"
            class="mt-5 px-6 py-3 rounded-xl
                   bg-white text-black
                   font-semibold"
          >
            Generate image
          </button>

        </div>

        <div
          id="imageResult"
          class="mt-8"
        ></div>

      </div>

    </section>

  </main>
</div>


<script>
let history = [];

const messagesEl =
  document.getElementById("messages");

const promptEl =
  document.getElementById("prompt");

const sendBtn =
  document.getElementById("sendBtn");

function escapeHtml(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function removeWelcome() {
  const welcome =
    document.getElementById("welcome");

  if (welcome) welcome.remove();
}

function addMessage(role, text) {
  removeWelcome();

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "max-w-4xl mx-auto mb-6";

  const isUser = role === "user";

  wrapper.innerHTML = `
    <div class="flex gap-3">
      <div class="
        w-9 h-9 rounded-xl flex-shrink-0
        flex items-center justify-center
        ${isUser
          ? "bg-zinc-800"
          : "bg-gradient-to-br from-indigo-500 to-purple-600"}
      ">
        ${isUser ? "U" : "A"}
      </div>

      <div class="flex-1 min-w-0">
        <div class="text-xs text-zinc-500 mb-1">
          ${isUser ? "You" : "AetherAI"}
        </div>

        <div class="message text-zinc-200">
          ${escapeHtml(text)}
        </div>
      </div>
    </div>
  `;

  messagesEl.appendChild(wrapper);

  messagesEl.scrollTop =
    messagesEl.scrollHeight;
}

function useSuggestion(text) {
  promptEl.value = text;
  promptEl.focus();
}

function newChat() {
  history = [];

  messagesEl.innerHTML = `
    <div
      id="welcome"
      class="max-w-3xl mx-auto
             min-h-full flex flex-col
             justify-center"
    >
      <div class="text-4xl md:text-6xl font-bold">
        Build with
        <span class="
          bg-gradient-to-r
          from-indigo-400 to-purple-400
          bg-clip-text text-transparent
        ">
          AetherAI
        </span>
      </div>

      <p class="mt-5 text-zinc-400 text-lg">
        Start a new conversation.
      </p>
    </div>
  `;
}

function showChat() {
  document
    .getElementById("chatView")
    .classList.remove("hidden");

  document
    .getElementById("imageView")
    .classList.add("hidden");

  document
    .getElementById("pageTitle")
    .textContent = "AI Chat";
}

function showImage() {
  document
    .getElementById("chatView")
    .classList.add("hidden");

  document
    .getElementById("imageView")
    .classList.remove("hidden");

  document
    .getElementById("pageTitle")
    .textContent = "Image Studio";
}

async function sendMessage() {
  const text = promptEl.value.trim();

  if (!text) return;

  promptEl.value = "";

  addMessage("user", text);

  history.push({
    role: "user",
    content: text
  });

  sendBtn.disabled = true;
  sendBtn.textContent = "Thinking...";

  try {
    const response = await fetch(
      "/api/chat",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          messages: history,
          persona:
            document.getElementById(
              "persona"
            ).value
        })
      }
    );

    const data =
      await response.json();

    if (!response.ok || !data.success) {
      throw new Error(
        data.error ||
        "AI request failed."
      );
    }

    addMessage(
      "assistant",
      data.answer
    );

    history.push({
      role: "assistant",
      content: data.answer
    });

  } catch (error) {

    addMessage(
      "assistant",
      "Error: " + error.message
    );

  } finally {

    sendBtn.disabled = false;
    sendBtn.textContent = "Send";
  }
}

async function generateImage() {
  const prompt =
    document
      .getElementById("imagePrompt")
      .value.trim();

  const negativePrompt =
    document
      .getElementById("negativePrompt")
      .value.trim();

  const result =
    document.getElementById(
      "imageResult"
    );

  if (!prompt) {
    result.innerHTML = `
      <div class="text-red-400">
        Enter an image prompt.
      </div>
    `;
    return;
  }

  result.innerHTML = `
    <div class="glass rounded-2xl p-6
                text-zinc-400">
      Generating image...
    </div>
  `;

  try {

    const response =
      await fetch(
        "/api/generate-image",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            prompt,
            negativePrompt,
            steps: 20,
            guidance: 7.5,
            width: 1024,
            height: 1024
          })
        }
      );

    if (!response.ok) {
      let errorText =
        "Image generation failed.";

      try {
        const data =
          await response.json();

        errorText =
          data.error || errorText;

      } catch {}

      throw new Error(errorText);
    }

    const blob =
      await response.blob();

    const imageUrl =
      URL.createObjectURL(blob);

    result.innerHTML = `
      <div class="glass rounded-2xl p-4">
        <img
          src="${imageUrl}"
          class="w-full rounded-xl"
          alt="Generated image"
        >
      </div>
    `;

  } catch (error) {

    result.innerHTML = `
      <div class="
        glass rounded-2xl p-5
        text-red-400
      ">
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}

promptEl.addEventListener(
  "keydown",
  (event) => {
    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      sendMessage();
    }
  }
);

async function checkHealth() {
  try {
    const response =
      await fetch("/api/health");

    const data =
      await response.json();

    if (data.success) {
      document
        .getElementById("status")
        .classList.remove("hidden");
    }
  } catch {}
}

checkHealth();
</script>

</body>
</html>
